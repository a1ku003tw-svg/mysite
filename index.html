<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shenirite | Visual & Motion</title>
  
  <!-- FontAwesome 圖示 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-color: #0d0e11;
      --text-main: #ffffff;
      --text-sub: rgba(255, 255, 255, 0.45);
      --btn-bg: rgba(255, 255, 255, 0.03);
      --btn-hover-bg: rgba(255, 255, 255, 0.1);
      --btn-border: rgba(255, 255, 255, 0.08);
      --toggle-btn-bg: rgba(255, 255, 255, 0.05);
    }

    [data-theme="light"] {
      --bg-color: #f4f5f7;
      --text-main: #111111;
      --text-sub: rgba(0, 0, 0, 0.45);
      --btn-bg: rgba(255, 255, 255, 0.6);
      --btn-hover-bg: #ffffff;
      --btn-border: rgba(0, 0, 0, 0.06);
      --toggle-btn-bg: rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      transition: background-color 0.4s ease, color 0.4s ease, border-color 0.4s ease, transform 0.25s ease;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 20px 40px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
    }

    /* 切換深淺模式按鈕 */
    .theme-toggle {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 100;
      background: var(--toggle-btn-bg);
      border: 1px solid var(--btn-border);
      backdrop-filter: blur(12px);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: var(--text-main);
      font-size: 0.95rem;
    }
    .theme-toggle:hover {
      transform: scale(1.08);
    }

    /* 主內容容器 (無卡片外框) */
    .main-container {
      width: 100%;
      max-width: 360px;
      text-align: center;
      margin: auto 0;
    }

    /* 大頭貼 */
    .avatar-wrapper {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      filter: grayscale(15%);
    }

    /* 標題與簡介 */
    .profile-name {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .profile-bio {
      font-size: 0.68rem;
      color: var(--text-sub);
      letter-spacing: 1.8px;
      margin-bottom: 40px;
      line-height: 1.6;
      font-weight: 300;
    }

    /* 連結按鈕清單 */
    .links-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      width: 100%;
      padding: 14px 20px;
      background: var(--btn-bg);
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 3px;
      border-radius: 30px; /* 質感懸浮圓弧 */
      border: 1px solid var(--btn-border);
      backdrop-filter: blur(8px);
    }

    .link-btn i {
      position: absolute;
      left: 20px;
      font-size: 0.95rem;
      opacity: 0.6;
    }

    .link-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--text-main);
      transform: translateY(-2px);
    }

    /* 底部獨立 Email 高級質感區塊 */
    .footer-email {
      margin-top: 40px;
      text-align: center;
    }

    .footer-email a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.65rem; /* 微型精細字體 */
      font-weight: 300;
      letter-spacing: 2.5px;
      transition: color 0.3s ease;
    }

    .footer-email a:hover {
      color: var(--text-main);
    }
  </style>
</head>
<body>

  <!-- 深淺模式切換按鈕 -->
  <button class="theme-toggle" id="themeToggle" title="切換深色/淺色模式">
    <i class="fa-solid fa-moon"></i>
  </button>

  <!-- 主內容區塊 (無卡片邊框) -->
  <div class="main-container">
    <div class="avatar-wrapper">
      <img src="https://i.ibb.co/7tHBhtGV/icon.png" alt="Shenirite Icon" class="avatar">
    </div>
    
    <h1 class="profile-name">Shenirite</h1>
    <p class="profile-bio">ᴋᴘᴏᴘ．ᴠɪꜱᴜᴀʟ ᴍᴏᴛɪᴏɴ ᴇᴅɪᴛ．ᴀɴɪᴍᴀᴛɪᴏɴ</p>

    <div class="links-container">
      <a href="https://fori.io/shenirite" target="_blank" class="link-btn">
        <i class="fa-solid fa-folder-open"></i> PORTFOLIO
      </a>
      <a href="https://www.instagram.com/shnrtfx/" target="_blank" class="link-btn">
        <i class="fa-brands fa-instagram"></i> INSTAGRAM
      </a>
      <a href="https://www.tiktok.com/@shnrtfx" target="_blank" class="link-btn">
        <i class="fa-brands fa-tiktok"></i> TIKTOK
      </a>
      <a href="https://www.youtube.com/@sheniritevfx" target="_blank" class="link-btn">
        <i class="fa-brands fa-youtube"></i> YOUTUBE
      </a>
    </div>
  </div>

  <!-- 最下方獨立進階感 Email -->
  <div class="footer-email">
    <a href="mailto:a1ku003tw@gmail.com">a1ku003tw@gmail.com</a>
  </div>

  <script>
    // 深色 / 淺色模式切換邏輯
    const themeToggle = document.getElementById('themeToggle');
    const htmlElement = document.documentElement;
    const icon = themeToggle.querySelector('i');

    themeToggle.addEventListener('click', () => {
      const currentTheme = htmlElement.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      htmlElement.setAttribute('data-theme', newTheme);
      
      if (newTheme === 'light') {
        icon.className = 'fa-solid fa-sun';
      } else {
        icon.className = 'fa-solid fa-moon';
      }
    });
  </script>

</body>
</html>
